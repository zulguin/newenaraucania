name: Publicar web jugable para iOS y PC
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/prepare_web_play.py'
      - '.github/workflows/deploy-web-game.yml'
      - 'Newen_Araucania_Galeria_Web_*.zip'
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: newen-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Elegir última versión web publicada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' > releases.jsonl
          python - <<'PY'
          import json, os, re
          choices = []
          for line in open('releases.jsonl'):
              r = json.loads(line)
              tag = r['tag_name']
              if r['draft'] or not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
                  continue
              assets = [a['name'] for a in r['assets'] if a['state']=='uploaded'
                        and re.fullmatch(r'Newen_Araucania_V[0-9_]+[A-Za-z0-9_-]*_Web\.zip', a['name'])]
              if len(assets) == 1:
                  choices.append((tuple(map(int,tag[1:].split('.'))),tag,assets[0]))
          if not choices:
              raise SystemExit('Publica una release que incluya un ZIP web completo')
          _,tag,asset = max(choices)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('GAME_TAG='+tag+'\nGAME_ASSET='+asset+'\n')
          print('Versión web:',tag,asset)
          PY
      - name: Descargar versión web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GAME_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$GAME_ASSET" --dir "$RUNNER_TEMP/newen-web"
      - name: Preparar página y juego
        run: python tools/prepare_web_play.py "$RUNNER_TEMP/newen-web/$GAME_ASSET" "$GAME_TAG" "_site"
      - name: Publicar tráiler junto a la web
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess, tempfile
          from pathlib import Path
          choices = []
          for line in open('releases.jsonl', encoding='utf-8'):
              r = json.loads(line)
              tag = r['tag_name']
              if r['draft'] or not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
                  continue
              for a in r['assets']:
                  name = a['name']
                  normalized = re.sub(r'[^a-z0-9]', '', name.lower())
                  if a['state'] != 'uploaded' or not 0 < a['size'] <= 50_000_000:
                      continue
                  if not name.lower().endswith('.mp4') or 'trailer' not in normalized or 'newen' not in normalized:
                      continue
                  if not re.fullmatch(r'[a-zA-Z0-9_. -]+', name):
                      continue
                  priority = 2 if 'spritesanimados' in normalized else 1 if 'instagram' in normalized else 0
                  choices.append((tuple(map(int,tag[1:].split('.'))),priority,a.get('updated_at',''),tag,name))
          if choices:
              _,_,_,tag,name = max(choices)
              with tempfile.TemporaryDirectory() as tmp:
                  subprocess.run(['gh','release','download',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern',name,'--dir',tmp],check=True)
                  video = Path(tmp)/name
                  if not video.is_file() or video.stat().st_size > 50_000_000:
                      raise SystemExit('Tráiler no válido')
                  if sum(f.stat().st_size for f in Path('_site').rglob('*') if f.is_file()) + video.stat().st_size > 950_000_000:
                      raise SystemExit('La web supera el límite de tamaño')
                  dest = Path('_site/media/newen-trailer.mp4')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(video,dest)
                  print('Tráiler publicado:',tag,name)
          else:
              print('::warning::No se encontró un MP4 de tráiler en las releases públicas')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar web oficial
        id: deployment
        uses: actions/deploy-pages@v4
